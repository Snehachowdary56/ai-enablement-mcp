name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Type-check, unit, MCP and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t ai-enablement-mcp .

  n8n:
    name: n8n workflows end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install n8n
        run: npm install -g n8n@2
      - name: Import and run both workflows against the knowledge base API
        run: N8N_BIN=n8n npm run n8n:test
